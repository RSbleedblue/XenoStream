services:
  xtts-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xtts-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/home/appuser/.local/share/tts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
